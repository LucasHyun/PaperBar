name: Release

# v1.0.0 같은 태그를 push 하면 겸용(.app) 빌드를 만들어 GitHub Release 에 올림
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --universal

      - name: Zip
        run: ditto -c -k --keepParent build/PaperBar.app "PaperBar-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "PaperBar-${GITHUB_REF_NAME}.zip" \
            --title "PaperBar $GITHUB_REF_NAME" \
            --generate-notes
